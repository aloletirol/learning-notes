<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <!-- Markdown renderer + sanitizer, loaded from a CDN (no install needed) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">📓 Learning Notes</div>
    <button id="newNoteBtn" class="new-btn">+ New note</button>
    <input id="search" class="search" type="search" placeholder="Search notes…" />
    <div id="tags" class="tags"></div>
    <nav id="noteList" class="note-list"></nav>
    <div id="source" class="source"></div>
  </aside>

  <main id="main" class="main">
    <div class="loading">Loading notes…</div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
